name: Setup reboop
description: Install the supported Node.js runtime and locked development dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
        registry-url: https://registry.npmjs.org
    - run: npm ci
      shell: bash
